name: Sync UCSD exchange notes

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types:
      - exchange-notes-updated

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-ucsd-exchange-notes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the homepage
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Fetch the canonical exchange record
        run: python scripts/sync_exchange_notes.py

      - name: Commit the reading copy when it changed
        id: commit
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- exchange.md exchange-pages/)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- exchange.md exchange-pages/
          git commit -m "Sync UCSD exchange notes"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Request a GitHub Pages rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
