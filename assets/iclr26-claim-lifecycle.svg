<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Claim-lifecycle study design</title>
  <desc id="desc">A review is decomposed into claims, then aligned with author responses, reviewer follow-ups, and meta-review uptake.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7f"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0b1f3a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="330" rx="18" fill="#f6f8fb"/>
  <text x="60" y="55" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#0b1f3a">From review text to institutional uptake</text>
  <text x="60" y="84" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#536274">The unit of analysis is the claim, not the review as a whole.</text>

  <g filter="url(#shadow)">
    <rect x="55" y="125" width="190" height="125" rx="14" fill="#ffffff" stroke="#c9d3df"/>
    <rect x="315" y="125" width="190" height="125" rx="14" fill="#ffffff" stroke="#c9d3df"/>
    <rect x="575" y="125" width="190" height="125" rx="14" fill="#ffffff" stroke="#c9d3df"/>
    <rect x="835" y="125" width="190" height="125" rx="14" fill="#ffffff" stroke="#c9d3df"/>
  </g>

  <circle cx="90" cy="160" r="18" fill="#173f73"/>
  <circle cx="350" cy="160" r="18" fill="#138a8a"/>
  <circle cx="610" cy="160" r="18" fill="#d97706"/>
  <circle cx="870" cy="160" r="18" fill="#7048a8"/>
  <text x="90" y="166" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="white">1</text>
  <text x="350" y="166" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="white">2</text>
  <text x="610" y="166" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="white">3</text>
  <text x="870" y="166" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="white">4</text>

  <text x="80" y="200" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#0b1f3a">Claim extraction</text>
  <text x="80" y="226" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#536274">416,862 claims</text>
  <text x="340" y="200" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#0b1f3a">Author response</text>
  <text x="340" y="226" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#536274">addressed or missed</text>
  <text x="600" y="200" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#0b1f3a">Reviewer follow-up</text>
  <text x="600" y="226" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#536274">pursued or dropped</text>
  <text x="860" y="190" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#0b1f3a">Meta-review</text>
  <text x="860" y="211" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#0b1f3a">uptake</text>
  <text x="860" y="235" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#536274">recorded or absent</text>

  <line x1="255" y1="188" x2="302" y2="188" stroke="#5b6b7f" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="515" y1="188" x2="562" y2="188" stroke="#5b6b7f" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="775" y1="188" x2="822" y2="188" stroke="#5b6b7f" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1038" y="125" width="108" height="125" rx="14" fill="#0b1f3a"/>
  <text x="1092" y="158" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#9fd8d4">OUTCOME</text>
  <text x="1092" y="188" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="white">Institutional</text>
  <text x="1092" y="211" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="white">trace</text>
  <line x1="1025" y1="188" x2="1034" y2="188" stroke="#5b6b7f" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="60" y="300" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#536274">Each stage is aligned within the same OpenReview forum; fixed-effects models compare claims within the same paper.</text>
</svg>
